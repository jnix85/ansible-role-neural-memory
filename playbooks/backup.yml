---
- name: Trigger On-Demand Backup of Neural Memory PostgreSQL
  hosts: neural_memory_servers
  become: true
  tasks:
    - name: Run backup script
      ansible.builtin.command: /usr/local/sbin/neural-memory-backup.sh
      register: neural_memory_manual_backup
      changed_when: true

    - name: Output backup status
      ansible.builtin.debug:
        var: neural_memory_manual_backup.stdout_lines

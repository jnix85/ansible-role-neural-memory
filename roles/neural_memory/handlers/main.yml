---
# SPDX-License-Identifier: MIT
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart neural-memory
  ansible.builtin.systemd:
    name: "{{ neural_memory_service_name }}"
    state: restarted
  when:
    - not ansible_check_mode
    - neural_memory_service_enabled | bool

- name: Restart neural-memory-backup-timer
  ansible.builtin.systemd:
    name: neural-memory-backup.timer
    state: restarted
  when:
    - not ansible_check_mode
    - neural_memory_backup_enabled | bool
